# Full dockerised Chess Coach stack.
#
#   docker compose up -d     # start everything
#   docker compose logs -f   # tail everything
#   docker compose down      # stop (data persists in named volumes)
#
# On first start `postgres` auto-applies everything in ./sql via the
# standard /docker-entrypoint-initdb.d mount. The api container builds
# lc0 from source in a multi-stage step — cached on rebuilds.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chess_postgres
    environment:
      POSTGRES_DB:       chess_coach
      POSTGRES_USER:     chess
      POSTGRES_PASSWORD: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_coach"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: chess_redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: chess_ollama
    volumes:
      - ollama:/root/.ollama
    # GPU mode is enabled via backend-specific compose overrides (use scripts with --gpu).

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess_api
    environment:
      DATABASE_URL:   postgresql://chess:chess@postgres:5432/chess_coach
      REDIS_URL:      redis://redis:6379/0
      OLLAMA_URL:     http://ollama:11434
      STOCKFISH_PATH: stockfish
      LC0_PATH:       lc0
      MAIA_WEIGHTS:   /app/models/maia-1900.pb.gz
      MAIA_MODELS_DIR: /app/models/individuals
      COACH_MODEL:    qwen2.5:32b-instruct
      DESC_MODEL:     qwen2.5:14b-instruct
      EMBED_MODEL:    bge-m3
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
      ollama:   { condition: service_started }
    volumes:
      # Host-mounted so `setup.sh` can pre-download Maia weights and
      # ECO TSVs without rebuilding the image.
      - ./models:/app/models
      - ./data:/app/data
      # Live code mount for dev — uvicorn --reload picks up changes.
      - ./chess_coach:/app/chess_coach
    command: ["uvicorn", "chess_coach.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_frontend
    environment:
      # The vite proxy forwards /api to this URL. Inside the compose
      # network the api is reachable as http://api:8000.
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on: [api]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    ports: ["${HOST_FRONTEND_BIND:-127.0.0.1}:${HOST_FRONTEND_PORT:-5173}:5173"]

volumes:
  pgdata:
  redisdata:
  ollama:
