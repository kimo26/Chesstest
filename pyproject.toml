[project]
name = "chess_coach"
version = "0.1.0"
description = "Personalized local chess openings coach (Ollama + maia-individual)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "numpy>=2.0",
    "chess>=1.11",
    "fsrs>=4.0",
    "dramatiq[redis]>=1.17",
    "redis>=5.1",
    "tenacity>=9.0",
    "structlog>=24.4",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pypdf>=5.0",
]

[project.optional-dependencies]
train = [
    # Needed only if you fine-tune maia-individual locally.
    "torch>=2.4",
    "tensorflow>=2.15",  # lc0's training pipeline uses TF
    "protobuf>=4.25",
]

[tool.setuptools]
packages = ["chess_coach"]
